name: ingest earthquakes

on:
  schedule:
    # UTC. Every 30 minutes so several unattended runs land before the
    # deadline. GitHub may start a scheduled run a few minutes late.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull new earthquakes
        run: python phase3_ingest.py
      - name: Commit the live file
        run: |
          git config user.name "earthquake-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/earthquakes.jsonl
          if git diff --staged --quiet; then
            echo "no new rows"
          else
            git commit -m "Ingest USGS earthquakes"
            git push
          fi
